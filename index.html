<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What's for dinner?</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Caveat:wght@600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--void:#14121f;--panel:#1d1a2c;--ink:#f4efe6;--muted:#9a94b0;--line:#3a3552;--pink:#ff6f91;--gold:#ffd166;--teal:#5fd0c5;--paper:#fffdf8;--dark:#1b1826;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--void);background-image:radial-gradient(#ffffff14 1px,transparent 1.2px);background-size:24px 24px;color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.08;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#stars{display:none}
main{max-width:480px;margin:0 auto;padding:26px 20px 56px}
.hand{font-family:'Caveat',cursive,'Segoe Print',sans-serif;font-weight:600}
.tag{margin:0;color:var(--gold);font-size:1.5rem;transform:rotate(-2deg);display:inline-block}
h1{font-size:clamp(2.6rem,12vw,3.6rem);font-weight:800;line-height:.98;letter-spacing:-.035em;margin:6px 0 10px}
.sub{color:var(--muted);margin:0;max-width:30ch;line-height:1.45}
.stage{display:flex;align-items:center;gap:6px;margin:14px 0 4px}
.machine{width:210px;flex:none;transform:rotate(-2deg);overflow:visible}
.cap{animation:bob 3.4s ease-in-out infinite}
.cap.b{animation-delay:-1.1s}.cap.c{animation-delay:-2.2s}
@keyframes bob{50%{transform:translateY(-4px)}}
.aside{font-size:1.5rem;line-height:1.1;color:var(--teal);transform:rotate(5deg);margin:0}
.pull{font:inherit;font-weight:800;font-size:1.15rem;color:var(--dark);background:var(--pink);border:3px solid var(--dark);border-radius:14px;padding:13px 34px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.pull:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--ink)}
.pull:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
#go{width:100%;font-size:1.3rem;padding:16px;border-color:var(--ink);box-shadow:5px 5px 0 var(--gold)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.pity{margin-top:22px;display:grid;gap:10px}
.meter{display:grid;grid-template-columns:2.2rem 1fr 5.5rem;gap:10px;align-items:center;font-family:'Space Mono',monospace;font-size:.75rem;color:var(--muted)}
.meter b{color:var(--c)}.g4{--c:var(--pink)}.g5{--c:var(--gold)}
.bar{height:12px;border:2px solid var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--c);transition:width .4s}
h2{font-family:'Space Mono',monospace;font-weight:400;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:34px 0 10px;display:flex;gap:10px;align-items:center}
h2::after{content:"";flex:1;border-top:2px dashed var(--line)}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hist li{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--panel);border:2px dashed var(--line);border-left:5px solid var(--c);border-radius:6px;font-weight:600}
.hist li:nth-child(odd){transform:rotate(-.4deg)}.hist li:nth-child(even){transform:rotate(.3deg)}
.hist .st{font-family:'Space Mono',monospace;color:var(--c);margin-left:auto;font-size:.8rem;white-space:nowrap}
.empty{color:var(--muted);justify-content:center;font-weight:400;border-left-color:var(--line)!important}
details{margin-top:26px;border:2px dashed var(--line);border-radius:8px;padding:12px 14px}
summary{cursor:pointer;font-weight:600}
.add{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 8px}
.add input,.add select{flex:1 1 110px;min-width:0;font:inherit;color:var(--ink);background:var(--void);border:2px solid var(--line);border-radius:8px;padding:9px 10px}
.add button{font:inherit;font-weight:700;color:var(--dark);background:var(--teal);border:2px solid var(--dark);border-radius:8px;padding:9px 16px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.custom{font-size:.9rem;color:var(--muted);margin:6px 0 0}
.custom button{background:none;border:0;color:var(--pink);cursor:pointer;font:inherit;text-decoration:underline}

#ov{position:fixed;inset:0;z-index:20;background:var(--void);display:none}
#ov.on{display:block}
#cv{position:absolute;inset:0;width:100%;height:100%}
#skip{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;z-index:3;font:inherit;font-size:.85rem;color:var(--ink);background:none;border:2px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer}
#rev{position:absolute;inset:0;z-index:2;display:none;place-items:center;padding:20px;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--tc) 30%,transparent),transparent 60%),var(--void)}
#rev.on{display:grid}
.rays{display:none}
.slip{position:relative;width:100%;max-width:330px;transform:rotate(-1.5deg);animation:rise .55s cubic-bezier(.2,1.3,.4,1)}
@keyframes rise{from{opacity:0;transform:translateY(60px) rotate(4deg)}to{opacity:1;transform:rotate(-1.5deg)}}
.tape{position:absolute;top:-13px;left:50%;width:96px;height:28px;background:var(--tc);opacity:.9;transform:translateX(-50%) rotate(3deg);z-index:2}
.card{background:var(--paper);color:var(--dark);padding:34px 22px 40px;font-family:'Space Mono',monospace;text-align:left;-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/20px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/20px 100%}
.hd{display:flex;justify-content:space-between;font-size:.72rem;letter-spacing:.12em;margin:0 0 12px}
.card hr{border:0;border-top:2px dashed #c9c3d4;margin:0 0 14px}
.stars-row{font-size:2rem;letter-spacing:.1em;color:var(--tc);-webkit-text-stroke:1.5px var(--dark);min-height:2.6rem}
.stars-row span{display:inline-block;opacity:0;transform:scale(2.2) rotate(-30deg);animation:starIn .4s forwards}
@keyframes starIn{to{opacity:1;transform:none}}
.dish{font-family:'Inter',system-ui,sans-serif;font-weight:800;font-size:2.1rem;line-height:1.05;letter-spacing:-.03em;margin:6px 0 8px}
.cuis{font-size:.72rem;letter-spacing:.14em;margin:0 0 12px;color:#6b657c}
.nt{font-family:'Caveat',cursive,sans-serif;font-weight:600;font-size:1.6rem;line-height:1.1;color:#d6335a;margin:0 0 14px;min-height:1.2em;transform:rotate(-1deg)}
.code{height:26px;margin:4px 0 18px;background:repeating-linear-gradient(90deg,var(--dark) 0 2px,#0000 2px 4px,var(--dark) 4px 5px,#0000 5px 9px)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .pull{font-size:1rem;padding:10px 20px;box-shadow:3px 3px 0 var(--dark);border-color:var(--dark)}
.row .pull.alt{background:var(--paper)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.stars-row span{opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<main>
  <p class="hand tag">made for <span id="who">xuxu</span></p>
  <h1>What's for<br>dinner?</h1>
  <p class="sub">Pull the knob. Whatever falls out is what we're eating. No take-backs.</p>

  <div class="stage">
    <svg class="machine" viewBox="0 0 220 290" role="img" aria-label="Capsule machine" fill="none" stroke="#f4efe6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="46" y="150" width="128" height="122" rx="14" fill="#ff6f91"/>
      <rect x="82" y="212" width="56" height="46" rx="8" fill="#14121f"/>
      <path d="M96 236h28"/>
      <circle cx="110" cy="178" r="15" fill="#ffd166"/>
      <path d="M110 166v24" transform="rotate(35 110 178)"/>
      <circle cx="110" cy="92" r="72" fill="#ffffff10"/>
      <rect x="88" y="12" width="44" height="14" rx="7" fill="#ffd166"/>
      <g transform="translate(78 112)"><g class="cap"><circle r="15" fill="#5fd0c5"/><path d="M-15 0a15 15 0 0 0 30 0z" fill="#f4efe6" stroke="none"/><path d="M-15 0h30"/></g></g>
      <g transform="translate(112 132)"><g class="cap b"><circle r="15" fill="#ff6f91"/><path d="M-15 0a15 15 0 0 0 30 0z" fill="#f4efe6" stroke="none"/><path d="M-15 0h30"/></g></g>
      <g transform="translate(142 104)"><g class="cap c"><circle r="15" fill="#ffd166"/><path d="M-15 0a15 15 0 0 0 30 0z" fill="#f4efe6" stroke="none"/><path d="M-15 0h30"/></g></g>
      <g transform="translate(100 80)"><g class="cap c"><circle r="15" fill="#ff6f91"/><path d="M-15 0a15 15 0 0 0 30 0z" fill="#f4efe6" stroke="none"/><path d="M-15 0h30"/></g></g>
      <g transform="translate(64 84)"><g class="cap b"><circle r="14" fill="#ffd166"/><path d="M-14 0a14 14 0 0 0 28 0z" fill="#f4efe6" stroke="none"/><path d="M-14 0h28"/></g></g>
    </svg>
    <p class="hand aside">psst: 5★ means sweet treat too :3 </p>
  </div>
  <button class="pull" id="go">Pull</button>

  <div class="pity">
    <div class="meter g4"><b>4★</b><div class="bar"><i id="b4"></i></div><span id="t4"></span></div>
    <div class="meter g5"><b>5★</b><div class="bar"><i id="b5"></i></div><span id="t5"></span></div>
  </div>

  <h2>Past pulls</h2>
  <ul class="hist" id="hist"></ul>

  <details>
    <summary>Add your own dishes</summary>
    <div class="add">
      <input id="nn" placeholder="Dish name" maxlength="40" aria-label="Dish name">
      <select id="nr" aria-label="Rarity"><option value="3">3★</option><option value="4">4★</option><option value="5">5★</option></select>
      <button id="ab">Add</button>
    </div>
    <p class="custom" id="cu"></p>
  </details>
</main>

<div id="ov" role="dialog" aria-label="Result">
  <canvas id="cv"></canvas>
  <button id="skip">Skip</button>
  <div id="rev"><div class="rays"></div>
    <div class="slip"><i class="tape"></i>
      <div class="card">
        <p class="hd"><span>DINNER ORDER</span><span id="no"></span></p>
        <hr>
        <div class="stars-row" id="sr"></div>
        <div class="dish" id="dn"></div>
        <p class="cuis" id="dc"></p>
        <p class="nt" id="dt"></p>
        <div class="code"></div>
        <div class="row"><button class="pull" id="again">Pull again</button><button class="pull alt" id="close">Close</button></div>
      </div>
    </div>
  </div>
</div>

<script>
const TIER={3:'#5fd0c5',4:'#ff6f91',5:'#ffd166'};
const BASE=[
 {n:'Margherita pizza',c:'Italian',r:3,t:'Classic. Add garlic bread.'},
 {n:'Chicken tikka masala',c:'Indian',r:3,t:'Extra naan, always.'},
 {n:'Pad thai',c:'Thai',r:3,t:'Sweet, tangy, done.'},
 {n:'Cheeseburger and fries',c:'American',r:3,t:'Share the fries. Or not.'},
 {n:'Katsu curry',c:'Japanese',r:3,t:'Crispy and cosy.'},
 {n:'Burrito bowl',c:'Mexican',r:3,t:'Guac is essential.'},
 {n:'Chicken shawarma wrap',c:'Middle Eastern',r:3,t:'Garlic sauce mandatory.'},
 {n:'Sushi platter',c:'Japanese',r:4,t:'Pick the one with the fancy rolls.'},
 {n:'Korean fried chicken',c:'Korean',r:4,t:'Two flavours, no arguments.'},
 {n:'Ramen with a soft egg',c:'Japanese',r:4,t:'Slurping is allowed.'},
 {n:'Dim sum spread',c:'Chinese',r:4,t:'Order too much on purpose.'},
 {n:'Mezze sharing board',c:'Greek',r:4,t:'Halloumi first.'},
 {n:'Truffle pasta',c:'Italian',r:4,t:'Candles optional, vibes required.'},
 {n:'Steak frites',c:'French',r:4,t:'Medium rare, obviously.'},
 {n:'Omakase-style sushi box',c:'Japanese',r:5,t:'Full date night. Dessert too.'},
 {n:'Lobster roll feast',c:'Seafood',r:5,t:'Treat night unlocked.'},
 {n:'Anything she wants + dessert',c:'Wildcard',r:5,t:'She chooses. You buy two puddings.'}
];
const $=id=>document.getElementById(id);
let orderNo=0,custom=[],hist=[],p4=0,p5=0,cur=null,anim=null;
try{custom=JSON.parse(localStorage.getItem('dw_c')||'[]');hist=JSON.parse(localStorage.getItem('dw_h')||'[]');p4=+localStorage.getItem('dw_p4')||0;p5=+localStorage.getItem('dw_p5')||0;orderNo=+localStorage.getItem('dw_n')||0}catch(e){}
const save=()=>{try{localStorage.setItem('dw_c',JSON.stringify(custom));localStorage.setItem('dw_h',JSON.stringify(hist.slice(0,8)));localStorage.setItem('dw_p4',p4);localStorage.setItem('dw_p5',p5);localStorage.setItem('dw_n',orderNo)}catch(e){}};
const pool=()=>BASE.concat(custom.map(d=>({n:d.n,c:'Your pick',r:d.r,t:''})));

function roll(){
  let r=3;
  const c5=p5>=29?1:.06+(p5>=20?(p5-19)*.1:0);
  if(Math.random()<c5)r=5;else if(p4>=9||Math.random()<.3)r=4;
  let o=pool().filter(d=>d.r===r);
  if(!o.length){r=r===5?4:3;o=pool().filter(d=>d.r===r)}
  if(!o.length)o=pool();
  const last=hist[0]&&hist[0].n,f=o.filter(d=>d.n!==last),L=f.length?f:o;
  const d=L[Math.floor(Math.random()*L.length)];
  p4=d.r>=4?0:p4+1;p5=d.r===5?0:p5+1;
  return d;
}
function meters(){
  $('b4').style.width=Math.min(p4,9)/9*100+'%';$('t4').textContent=(9-Math.min(p4,9)>0?(10-p4)+' left':'next warp');
  $('b5').style.width=Math.min(p5,29)/29*100+'%';$('t5').textContent=(30-Math.min(p5,29))+' left';
}
function renderHist(){
  const u=$('hist');u.innerHTML='';
  if(!hist.length){u.innerHTML='<li class="empty">No warps yet.</li>';return}
  hist.slice(0,6).forEach(d=>{
    const li=document.createElement('li');li.style.setProperty('--c',TIER[d.r]);
    li.innerHTML='<span></span><span class="st"></span>';
    li.children[0].textContent=d.n;li.children[1].textContent='★'.repeat(d.r);u.appendChild(li);
  });
}

/* background stars */
const sc=$('stars'),sx=sc.getContext('2d');let bs=[];
function sizeBg(){sc.width=innerWidth;sc.height=innerHeight;bs=Array.from({length:110},()=>({x:Math.random()*sc.width,y:Math.random()*sc.height,r:Math.random()*1.4+.3,p:Math.random()*6}))}
function bgLoop(t){sx.clearRect(0,0,sc.width,sc.height);
  bs.forEach(s=>{sx.globalAlpha=.35+.45*Math.sin(t/900+s.p);sx.fillStyle='#fff';sx.beginPath();sx.arc(s.x,s.y,s.r,0,7);sx.fill()});
  requestAnimationFrame(bgLoop)}
sizeBg();addEventListener('resize',sizeBg);requestAnimationFrame(bgLoop);

/* warp animation */
const cv=$('cv'),cx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function startWarp(d){
  cur=d;$('rev').classList.remove('on');$('ov').classList.add('on');
  cv.width=innerWidth;cv.height=innerHeight;
  const W=cv.width,H=cv.height,X=W/2,Y=H*.42,col=TIER[d.r],DUR=reduce?200:2600;
  const S=Array.from({length:230},()=>({a:Math.random()*6.283,r:Math.random()*Math.max(W,H)*.4+8,s:Math.random()*.6+.4}));
  const t0=performance.now();let done=false;
  function end(){if(done)return;done=true;cancelAnimationFrame(anim);cx.clearRect(0,0,W,H);reveal(d)}
  $('skip').onclick=end;
  (function f(now){
    const t=now-t0,k=Math.min(t/DUR,1),v=1+k*k*22;
    cx.fillStyle='rgba(20,18,31,'+(.25+.3*(1-k))+')';cx.fillRect(0,0,W,H);
    S.forEach(s=>{
      const r0=s.r;s.r+=s.s*v*(.6+s.r/300);
      const x0=X+Math.cos(s.a)*r0,y0=Y+Math.sin(s.a)*r0,x1=X+Math.cos(s.a)*s.r,y1=Y+Math.sin(s.a)*s.r;
      cx.strokeStyle=k>.72?col:'#f4efe6';cx.globalAlpha=Math.min(1,.3+k);cx.lineWidth=1+k*2;
      cx.beginPath();cx.moveTo(x0,y0);cx.lineTo(x1,y1);cx.stroke();
      if(s.r>Math.hypot(W,H)*.6)s.r=Math.random()*40+4;
    });
    cx.globalAlpha=1;
    const g=cx.createRadialGradient(X,Y,0,X,Y,60+k*Math.max(W,H)*.5);
    g.addColorStop(0,k>.72?col:'#fff');g.addColorStop(1,'transparent');
    cx.globalAlpha=k*k*.85;cx.fillStyle=g;cx.beginPath();cx.arc(X,Y,60+k*Math.max(W,H)*.5,0,7);cx.fill();cx.globalAlpha=1;
    if(k>=1)end();else anim=requestAnimationFrame(f);
  })(t0);
}
function reveal(d){
  const r=$('rev');r.style.setProperty('--tc',TIER[d.r]);
  const row=$('sr');row.innerHTML='';
  for(let i=0;i<d.r;i++){const s=document.createElement('span');s.textContent='★';s.style.animationDelay=(.15+i*.18)+'s';row.appendChild(s)}
  orderNo++;$('no').textContent='#'+String(orderNo).padStart(3,'0');$('dn').textContent=d.n;$('dc').textContent=d.c.toUpperCase();$('dt').textContent=d.t;
  r.classList.remove('on');void r.offsetWidth;r.classList.add('on');
  hist.unshift(d);save();renderHist();meters();
}
function go(){
  if($('ov').classList.contains('on')&&$('rev').classList.contains('on')){}
  startWarp(roll());
}
$('go').onclick=go;
$('again').onclick=go;
$('close').onclick=()=>{$('ov').classList.remove('on');$('rev').classList.remove('on')};

/* custom dishes */
function renderCustom(){
  const p=$('cu');p.innerHTML='';
  if(!custom.length){p.textContent='Nothing custom yet.';return}
  custom.forEach((d,i)=>{
    const s=document.createElement('span');s.textContent=d.n+' ('+d.r+'★) ';
    const b=document.createElement('button');b.textContent='remove';b.onclick=()=>{custom.splice(i,1);save();renderCustom()};
    s.appendChild(b);p.appendChild(s);p.appendChild(document.createTextNode(' '));
  });
}
$('ab').onclick=()=>{const n=$('nn').value.trim();if(!n)return;custom.push({n:n,r:+$('nr').value});$('nn').value='';save();renderCustom()};
renderHist();meters();renderCustom();
</script>
</body>
</html>
